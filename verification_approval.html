<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Verification Approved</title>
  <style>
    :root{--bg:#f3f4f6;--accent:#16a34a;--panel:#ffffff}
    html,body{height:100%;margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
    body{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#e6f7ee 0%, #f3f4f6 100%)}

    /* modal */
    .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.35);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s ease}
    .overlay.show{opacity:1;pointer-events:auto}

    .panel{width:320px;max-width:90%;background:var(--panel);border-radius:14px;padding:28px 20px 22px;box-shadow:0 10px 30px rgba(2,6,23,.12);text-align:center;transform:translateY(10px) scale(.98);transition:transform .28s cubic-bezier(.2,.9,.3,1),opacity .2s;opacity:0}
    .overlay.show .panel{transform:translateY(0) scale(1);opacity:1}

    /* checkmark */
    .badge{width:100px;height:100px;margin:0 auto 12px;display:block}
    .circle{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}

    /* animate the circle and check path */
    .path-circle{stroke-dasharray:314;stroke-dashoffset:314;animation:drawCircle .7s ease-out forwards}
    .path-check{stroke-dasharray:50;stroke-dashoffset:50;animation:drawCheck .45s .65s ease-out forwards}

    @keyframes drawCircle{to{stroke-dashoffset:0}}
    @keyframes drawCheck{to{stroke-dashoffset:0}}

    h1{margin:6px 0 0;font-size:20px;color:#0f172a}
    p{margin:8px 0 14px;color:#475569;font-size:14px}

    .approved-pill{display:inline-block;padding:8px 14px;border-radius:999px;background:rgba(22,163,74,.12);color:var(--accent);font-weight:600;letter-spacing:.4px}

    .btn{margin-top:6px;border:0;background:#efefef;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}

    /* subtle bounce when shown */
    .panel{animation:pop .6s cubic-bezier(.2,.9,.3,1)}
    @keyframes pop{0%{transform:translateY(6px) scale(.98);opacity:0}60%{transform:translateY(-6px) scale(1.02)}100%{transform:translateY(0) scale(1);opacity:1}}

    /* small responsive tweaks */
    @media (max-width:360px){.panel{padding:20px}}
  </style>
</head>
<body>

  <!-- Loading spinner -->
  <div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:white;z-index:50;">
    <div class="spinner" style="width:60px;height:60px;border:6px solid #e5e7eb;border-top-color:#16a34a;border-radius:50%;animation:spin 1s linear infinite;"></div>
  </div>

  <style>
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>

  <div id="overlay" class="overlay" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="approved-title">
      <svg class="badge" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="circle path-circle" cx="50" cy="50" r="48" stroke-opacity="0.95"></circle>
        <polyline class="circle path-check" points="30,52 44,66 72,36" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></polyline>
      </svg>

      <h1 id="approved-title">Approved</h1>
      <p>You're good to go — the action was successful.</p>
      <div>
        <span class="approved-pill"> Verified</span>
      </div>
      
    </div></div>

  

  <script>
// fixed working logic
window.addEventListener('DOMContentLoaded', function(){
    const loading = document.getElementById('loading');
    const overlay = document.getElementById('overlay');
    const afterImage = document.getElementById('afterImage');

    // 1) Loading for 2 seconds
    setTimeout(() => {
        loading.style.display = 'none';

        // 2) Show approved popup
        overlay.classList.add('show');
        overlay.setAttribute('aria-hidden','false');

        // 3) After 3 seconds hide popup and show image
        setTimeout(() => {
            overlay.classList.remove('show');
            overlay.setAttribute('aria-hidden','true');
            afterImage.style.display = 'flex';
        }, 3000);

    }, 2000);
});
</script>
